name: Refresh listings and deploy

on:
  schedule:
    # Hourly. The goal is to apply within 12h of a posting, and 3x/day left an
    # 8-hour blind spot before a listing was even visible.
    #
    # Deliberately at :17, not :00 — GitHub documents that scheduled runs are
    # delayed under load and that "high load times include the start of every
    # hour", so the top of the hour is the worst slot to ask for.
    - cron: "17 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual refresh from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest listings
        # If the upstream source is down or changes shape, fetch_jobs.py exits
        # non-zero without touching data/jobs.json. Keep going so the site still
        # redeploys with the last good data instead of the run failing outright.
        continue-on-error: true
        run: |
          # Once a day, sweep every known company board and recompute which of
          # them actually post new-grad roles. Every other hour, poll just that
          # productive subset -- ~223 boards instead of ~892, same yield, and a
          # fraction of the requests.
          if [ "$(date -u +%H)" = "06" ]; then
            python3 scripts/fetch_jobs.py --full
          else
            python3 scripts/fetch_jobs.py
          fi
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- data/jobs.json data/boards.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit updated data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "grad-job-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json data/boards.json
          git commit -m "Refresh listings [automated]"
          # Rebase-and-retry in case you pushed an edit while this run was
          # mid-flight; the data commit touches only data/jobs.json.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin main || true
          done
          echo "Could not push refreshed data after 3 attempts" >&2
          exit 1

  deploy:
    needs: refresh
    # Hourly schedule, but Pages only needs redeploying when the data actually
    # changed. Pushes and manual runs always deploy, so a code-only change to
    # index.html still goes out.
    if: needs.refresh.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
