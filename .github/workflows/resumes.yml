name: Build resumes

# Deliberately separate from refresh.yml. That one runs hourly; this installs a
# TeX distribution and must only run when resume inputs actually change.
on:
  push:
    paths:
      - 'resumes/**'
      - '.github/workflows/resumes.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: resumes
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyyaml
        run: python3 -m pip install --quiet pyyaml

      - name: Install TeX
        # recommended: geometry, xcolor, hyperref, array, tabularx
        # extra:       enumitem, titlesec, zref-savepos
        # fonts-extra: sourcesans (the resume's typeface)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-extra

      - name: Build every variant
        # build.py exits non-zero if any profile misses the two-page target, so
        # a layout regression fails the run instead of shipping a short resume.
        run: python3 resumes/build.py --all

      - name: Commit built PDFs
        run: |
          git config user.name "grad-job-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add resumes/out data/resumes.json
          if git diff --cached --quiet; then
            echo "No resume changes to commit"
            exit 0
          fi
          git commit -m "Rebuild resumes [automated]"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin main || true
          done
          echo "Could not push rebuilt resumes after 3 attempts" >&2
          exit 1
