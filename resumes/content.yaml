    bullets:
      - id: ra-dataset
        weight: 10
        tags: [ml, hpc, gpu, data-pipeline, benchmark, research, slurm]
        sde: >-
          Built an automated ingestion and feature-engineering pipeline converting raw
          SLURM telemetry from 941 profiled HPC training jobs across 9 NVIDIA GPU
          configurations (A100, A40, RTX, T4, and multi-GPU) into a structured
          37-feature dataset used for downstream model training.
        ml: >-
          Constructed a 941-job deep learning runtime benchmark spanning 37 model
          architectures (CNNs, ViTs, BERT/T5/BART, GPT-2, Llama-2 7B, Qwen2.5, diffusion
          and video models) across 9 NVIDIA GPU configurations, with a 37-feature schema
          capturing batch size, sequence length, precision, parallelism, and optimizer
          configuration.
      - id: ra-inference
        weight: 9
        tags: [ml, gpu, benchmark, inference, research, llm]
        text: >-
          Extended the benchmark with a 1,884-run LLM inference dataset capturing
          prefill/decode split timing, TTFT, TPOT, and KV-cache pressure across 22
          models and 4 GPU types.
      - id: ra-models
        weight: 9
        tags: [ml, xgboost, gbdt, prediction, research, evaluation]
        sde: >-
          Trained gradient-boosted and neural regressors on the resulting dataset,
          reaching 23.7\% MAPE (R\textsuperscript{2}\,=\,0.881) on training-job runtime
          and 8.8\% MAPE (R\textsuperscript{2}\,=\,0.982) on inference latency.
        ml: >-
          Trained GBDT, Random Forest, and neural regressors reaching 23.7\% MAPE
          (R\textsuperscript{2}\,=\,0.881) on training runtime and 8.8\% MAPE
          (R\textsuperscript{2}\,=\,0.982) on inference latency; identified log-transform
