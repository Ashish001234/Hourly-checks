# =============================================================================
# Resume content library -- the single source of truth.
#
# Every bullet is written once here, tagged, and weighted. build.py selects and
# orders them per profile (and per job description), so the SDE and ML resumes
# stop being two copy-pasted files that drift apart.
#
# Rules for editing:
#   * Everything here must be TRUE and defensible in an interview. Wording is
#     deliberately generous; the underlying facts are not negotiable.
#   * Text is LaTeX and uses YAML block scalars (`>-`) so backslashes stay
#     literal. Never switch a bullet to "double quotes" -- YAML will eat \& \%.
#   * `sde:` / `ml:` give audience-specific phrasings of the same real work.
#     A bare `text:` is used for both.
#   * weight 1-10 = how strong the bullet is when nothing else distinguishes it.
#   * tags drive job-description matching. Keep them lowercase and reuse
#     existing ones where possible.
# =============================================================================

# -----------------------------------------------------------------------------
