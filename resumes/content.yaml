    stack: Llama-3.1-8B, Mistral-7B, Qwen-2.5-7B, LoRA, GSM8K, HumanEval, MBPP
    tags: [llm, nlp, evaluation, research, finetuning, alignment, ml]
    bullets:
      - id: st-study
        weight: 10
        tags: [llm, evaluation, research, nlp]
        text: >-
          Ran a controlled 3-model $\times$ 5-strategy $\times$ 4-dataset study (96
          conditions, 71,595 question-strategy pairs); correction broke 14.7\% of
          correct answers while helping only 4.4\% -- a 3.4$\times$ damage ratio -- with
          self-consistency dominating correction in 11 of 12 compute-matched comparisons.
      - id: st-sft
        weight: 10
        tags: [finetuning, lora, llm, ml, data]
        text: >-
          Constructed two SFT datasets (D1 single-step detection, D2 late-detection with
          retrace) via an all-rollouts-wrong filter on MetaMathQA with DeepSeek-R1
          attribution; LoRA fine-tuning raised Mistral-7B from 47.61\% to 65.43\% on
          GSM8K (+17.82 pts), attribution signal alone contributing +2.96 pts.
      - id: st-code
        weight: 9
        tags: [llm, evaluation, research, code]
        text: >-
          Showed the same recipe regresses on code (MBPP $-$10.27, HumanEval $-$5.87,
          Codeforces-A $-$15.22), arguing intrinsic supervision interferes where an
          external verifier already exists; advised by Prof. Kuan-Hao Huang.

